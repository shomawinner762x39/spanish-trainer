    mentir: 'i', divertir: 'i', convertir: 'i', preferir: 'i', sentir: 'i',
    pedir: 'i', seguir: 'i', conseguir: 'i', elegir: 'i', repetir: 'i', servir: 'i', vestir: 'i', medir: 'i', competir: 'i',

  const STRONG = {
    tener: 'tuv', estar: 'estuv', poder: 'pud', poner: 'pus', saber: 'sup', querer: 'quis',
    venir: 'vin', hacer: 'hic', decir: 'dij', traer: 'traj', conducir: 'conduj', traducir: 'traduj',
    reducir: 'reduj', haber: 'hub', obtener: 'obtuv', andar: 'anduv', caber: 'cup',
  };

    querer: 'querr', hacer: 'har', decir: 'dir', haber: 'habr', valer: 'valdr', obtener: 'obtendr', caber: 'cabr',
  };

const TYPE_NAME = { T: 'Теория', K: 'Контрольная', O: 'Обобщение', I: 'Итоговая по блоку', F: 'Итоговая по уровню' };

// Полный список 250 уроков
function buildCourse() {
  const list = [];
  LEVELS.forEach((lv, li) => {
    const base = li * 50;
    lv.blocks.forEach((bl, bi) => {
      const start = base + bi * 10 + 1;
      const theoryIds = [start, start + 2, start + 4];
      BLOCK_PATTERN.forEach((type, k) => {
        const id = start + k;
        const item = { id, type, level: li, block: bi, theoryIds };
        if (type === 'K') item.theory = id - 1;
        if (type === 'I') item.part = k - 6; // 1..3
        list.push(item);
      });
    });
    for (let k = 0; k < 10; k++) list.push({ id: base + 41 + k, type: 'F', level: li, block: 4, part: k + 1 });
  });
  return list;
}

  // ---------- все формы глаголов: глагол × время × лицо ----------
  // У каждого глагола курса 30 клеток (6 времён × 5 лиц). Клетка входит в программу, когда пройдены
  // и сам глагол, и это время с этим лицом. Верный ответ с первой попытки +1, ошибка −1; 3 = освоено.
  const CT = ['pres', 'pret', 'perf', 'impf', 'fut', 'cond'];
  const CELL_NEED = 3;
  const AVAIL = {};
  LEVELS.forEach((lv, li) => lv.blocks.forEach((bl, bi) => (bl.tenses || lv.tenses).forEach(tn => bl.persons.forEach(p => {
    const k = tn + '|' + p; if (!(k in AVAIL)) AVAIL[k] = li * 50 + bi * 10 + 1;
  }))));
  CT.forEach(tn => [0, 1, 2, 3, 4].forEach(p => { if (!((tn + '|' + p) in AVAIL)) AVAIL[tn + '|' + p] = 191; }));
  const isInf = w => /^[a-záéíóúñ]+(ar|er|ir|ír)(se)?$/.test(w);
  const VINTRO = {};
  Object.values(THEORY).sort((a, b) => a.id - b.id).forEach(t => {
    (t.words || []).forEach(w => { const v = w[0].trim(); if (isInf(v) && !NOT_VERBS.includes(v) && !(v in VINTRO)) VINTRO[v] = t.id; });
    (t.forms ? t.forms.verbs : []).forEach(v => { if (!(v in VINTRO)) VINTRO[v] = t.id; });
  });
  for (const v in EXTRA_VERBS) if (!(v in VINTRO)) VINTRO[v] = EXTRA_VERBS[v];
  const formOf = (v, tn, p) => SPECIAL_FORMS[v] ? SPECIAL_FORMS[v][tn] : Conj.conj(v, tn)[p];
  // подпись лица в задании «форма глагола»
  function personLabel(v, p) {
    if (v === 'hay') return 'безлично (есть / имеется)';
    if (v === 'gustar') return p === 4 ? 'нравятся (много вещей)' : 'нравится (одна вещь, действие)';
    return Conj.PERSONS[p];
  }
  function allowedCell(v, tn, p) { const R = RESTRICT[v]; return !R || ((!R.t || R.t.includes(tn)) && (!R.p || R.p.includes(p))); }
  const CELLS = {};
  function cellsOf(v) {
    if (CELLS[v]) return CELLS[v];
    const out = [];
    CT.forEach(tn => { [0, 1, 2, 3, 4].forEach(p => { if (allowedCell(v, tn, p)) out.push({ v, tn, p, form: formOf(v, tn, p), unlock: Math.max(VINTRO[v] || 0, AVAIL[tn + '|' + p]) }); }); });
    return (CELLS[v] = out);
  }
  const ci = (tn, p) => CT.indexOf(tn) * 5 + p;
  function cellGet(v, tn, p) { const s = state.cells && state.cells[v]; return s ? +s[ci(tn, p)] : 0; }
  function cellAdd(v, tn, p, d) {
    if (!state.cells) state.cells = {};
    const s = state.cells[v] || '0'.repeat(30), i = ci(tn, p);
    state.cells[v] = s.slice(0, i) + Math.max(0, Math.min(9, +s[i] + d)) + s.slice(i + 1);
  }
  // какие формы глаголов есть во фразе (для обычных фраз уроков)
  let FORMIDX = null;
  const FORM_STOP = new Set(['como', 'vino', 'entre', 'sobre', 'baja', 'cobra', 'para', 'pesa', 'nada', 'toca', 'llama', 'cuenta', 'prueba', 'vale', 'muere']);
  function formIndex() {
    if (FORMIDX) return FORMIDX;
    FORMIDX = new Map();
    for (const v in VINTRO) cellsOf(v).forEach(c => { const k = c.form.toLowerCase(); if (FORM_STOP.has(k)) return; if (!FORMIDX.has(k)) FORMIDX.set(k, []); FORMIDX.get(k).push(c); });
    return FORMIDX;
  }
  function tagsOf(t) {
    if (t.kind === 'form') return [{ v: t.verb, tn: t.tense, p: t.person }];
    if (t.cell) return [{ v: t.cell[0], tn: t.cell[1], p: t.cell[2] }];
    const w = norm(first(t.es)).split(' '), idx = formIndex(), out = [];
    for (let i = 0; i < w.length; i++) for (let n = 3; n >= 1; n--) { const g = idx.get(w.slice(i, i + n).join(' ')); if (g) { out.push(...g); break; } }
    return out;
  }
  function credit(t, ok) {
    const explicit = t.kind === 'form' || !!t.cell;
    if (!ok && !explicit) return;
    tagsOf(t).forEach(c => cellAdd(c.v, c.tn, c.p, ok ? 1 : -1));
    if (t.rv != null) state.rs[t.rv] = (state.rs[t.rv] || 0) + 1;
  }
  const reviewUnlock = x => VINTRO[x[0]] ? Math.max(VINTRO[x[0]], AVAIL[x[1] + '|' + x[2]]) : Infinity;
  // добор заданий: самые слабые формы среди уже пройденного + фразы-повторы к ним
  function coverageTasks(L, nForms, nPhr, r, exclude) {
    const cells = [];
    for (const v in VINTRO) cellsOf(v).forEach(c => { if (c.unlock <= L) cells.push(c); });
    const sorted = shuffle(cells, r).sort((a, b) => cellGet(a.v, a.tn, a.p) - cellGet(b.v, b.tn, b.p));
    const forms = [];
    for (const c of sorted) {
      if (forms.length >= nForms) break;
      const k = c.v + '|' + c.tn + '|' + c.p; if (exclude.has(k)) continue; exclude.add(k);
      forms.push({ kind: 'form', verb: c.v, tense: c.tn, person: c.p, es: c.form, from: VINTRO[c.v] });
    }
    const score = o => cellGet(o.x[0], o.x[1], o.x[2]) * 2 + (state.rs[o.i] || 0);
    const pool = REVIEW.map((x, i) => ({ x, i })).filter(o => reviewUnlock(o.x) <= L);
    const phr = shuffle(pool, r).sort((a, b) => score(a) - score(b)).slice(0, nPhr)
      .map(o => ({ kind: 'tr', ru: o.x[3], es: o.x[4], from: VINTRO[o.x[0]], cell: [o.x[0], o.x[1], o.x[2]], rv: o.i }));
    return shuffle([...phr, ...forms], r);
  }
  // сколько добавлять в каждый тип урока: [формы, фразы]
  const COV = { K: [6, 8], O: [20, 8], I: [10, 10], F: [12, 10] };
  function spread(main, extra) { // равномерно вплести extra в main
    if (!extra.length) return main;
    const out = [], step = (main.length + 1) / (extra.length + 1); let k = 0;
    main.forEach((m, i) => { out.push(m); while (k < extra.length && (k + 1) * step <= i + 1) out.push(extra[k++]); });
    while (k < extra.length) out.push(extra[k++]);

  }
  // до какого урока открыта программа (для тренировки форм вне уроков)
  function reachLesson() {
    if (state.free) return 250;
    const next = COURSE.find(c => !(state.done[c.id] && state.done[c.id].passed));
    return next ? next.id : 250;
  }

  // ---------- навигация ----------
  let view = 'home';
  const isUnlocked = id => state.free || id === 1 || !!(state.done[id - 1] && state.done[id - 1].passed);
  function status(id) { const d = state.done[id]; return d ? (d.passed ? 'passed' : 'tried') : (isUnlocked(id) ? 'open' : 'locked'); }
  function lessonTitle(item) {
    if (item.type === 'T') return THEORY[item.id] ? THEORY[item.id].t : 'Теория (готовится)';
    if (item.type === 'K') return 'Контрольная: ' + (THEORY[item.theory] ? THEORY[item.theory].t : '');
    const lv = LEVELS[item.level];
    if (item.type === 'O') return 'Обобщение: ' + lv.blocks[item.block].t;
    if (item.type === 'I') return 'Итоговая по блоку, часть ' + item.part + ': ' + lv.blocks[item.block].t;
    return 'Итоговая по уровню ' + lv.code + ', часть ' + item.part;
  }
  const ready = item => item.type === 'T' || item.type === 'K' ? !!THEORY[item.type === 'T' ? item.id : item.theory]
    : levelTheory(item.level).length > 0 && (item.type === 'F' || blockTheory(item.level, item.block).length > 0);

  function renderNav() {
    const nav = $('#levels'); nav.innerHTML = '';
    LEVELS.forEach((lv, li) => {
      const items = COURSE.filter(c => c.level === li);
      const passed = items.filter(c => state.done[c.id] && state.done[c.id].passed).length;
      nav.append(el('button', { class: 'lvchip lv' + li + (curLevel === li ? ' on' : ''), type: 'button', onclick: () => { curLevel = li; renderNav(); renderHome(); } },
        el('b', null, lv.code), el('span', null, passed + '/50')));
    });
  }
  let curLevel = 0;

  function renderHome() {
    view = 'home'; window.scrollTo(0, 0);
    const main = $('#main'); main.innerHTML = '';
    const nextId = COURSE.find(c => !(state.done[c.id] && state.done[c.id].passed) && isUnlocked(c.id));
    if (nextId) {
      const it = nextId;
      main.append(el('section', { class: 'next' },
        el('div', { class: 'eyebrow' }, 'Урок ' + it.id + ' · ' + TYPE_NAME[it.type] + ' · ' + LEVELS[it.level].code),

        el('button', { class: 'primary', type: 'button', onclick: () => openLesson(it.id), disabled: !ready(it) }, ready(it) ? 'Продолжить' : 'Урок ещё готовится')));
    }
    const lv = LEVELS[curLevel];
    main.append(el('div', { class: 'lvhead lv' + curLevel }, el('h2', null, lv.code + ' — ' + lv.title),
      el('p', null, 'Уроки ' + (curLevel * 50 + 1) + '–' + (curLevel * 50 + 50) + '. Четыре блока по 10 уроков и итоговая контрольная.')));
    lv.blocks.concat([{ t: 'Итоговая контрольная по уровню' }]).forEach((bl, bi) => {
      const items = COURSE.filter(c => c.level === curLevel && c.block === bi);
      main.append(el('section', { class: 'block' },
        el('h3', null, (bi < 4 ? 'Блок ' + (bi + 1) + '. ' : '') + bl.t),

        ' Открыть все уроки (автор советует идти строго по порядку)'),

      el('button', { class: 'ghost', type: 'button', onclick: renderTime }, 'Время занятий'),
      db && db.code ? el('button', { class: 'ghost', type: 'button', onclick: renderSync }, 'Синхронизация устройств') : null,

  }

  function header(item) {

      el('div', { class: 'eyebrow' }, 'Урок ' + item.id + ' · ' + TYPE_NAME[item.type] + ' · ' + LEVELS[item.level].code + (item.block < 4 ? ' · блок ' + (item.block + 1) : '')),

  function openLesson(id) {

  function exampleRow(p, i) {

  // ---------- контрольная ----------
  function runTest(item) {
    view = 'lesson'; window.scrollTo(0, 0);
    const W = item.type === 'W' || item.type === 'V';
    const attempt = W ? 0 : (state.done[item.id] && state.done[item.id].attempts) || 0;
    let tasks;
    if (item.type === 'W') tasks = weakTasks();
    else if (item.type === 'V') tasks = coverageTasks(reachLesson(), 15, 10, rng(Date.now() % 2147483647), new Set());
    else {
      const base = buildTasks(item, attempt);
      const ex = new Set(base.filter(t => t.kind === 'form').map(t => t.verb + '|' + t.tense + '|' + t.person));
      const [nf, np] = COV[item.type] || [0, 0];
      tasks = spread(base, coverageTasks(item.id, nf, np, rng(item.id * 31 + attempt * 7 + 3), ex));
    }
    const main = $('#main'); main.innerHTML = '';
    main.append(W ? el('div', { class: 'lhead' },
      el('button', { class: 'ghost back', type: 'button', onclick: item.type === 'V' ? renderVerbs : renderErrors }, item.type === 'V' ? '← Глаголы' : '← Мои ошибки'),
      el('div', { class: 'eyebrow' }, (item.type === 'V' ? 'Тренировка форм' : 'Тренировка ошибок') + ' · ' + tasks.length + ' заданий'),
      el('h2', null, item.type === 'V' ? 'Самые слабые формы' : 'Работа над ошибками')) : header(item));
    if (!tasks.length) { main.append(el('p', null, W ? 'Ошибок для тренировки нет.' : 'Для этого урока ещё нет заданий.')); return; }
    const queue = tasks.map((t, i) => Object.assign({ idx: i }, t));
    const firstTry = {}; let pos = 0, retries = 0; const mistakes = [];
    const bar = el('div', { class: 'progress' }, el('span'));
    const box = el('section', { class: 'card task' });
    main.append(bar, box);
    const total = tasks.length;
    function next() {
      if (pos >= queue.length) return finish();
      const t = queue[pos];
      const doneCount = Object.keys(firstTry).length;
      bar.firstChild.style.width = Math.round(doneCount / total * 100) + '%';
      box.innerHTML = '';
      const prompt = t.kind === 'form'
        ? el('div', { class: 'prompt form' }, el('span', { class: 'verb' }, t.verb), el('span', { class: 'gloss' }, glossOf(t.verb)), el('span', { class: 'pers' }, personLabel(t.verb, t.person)), el('span', { class: 'tense' }, Conj.TENSES[t.tense]))
        : el('div', { class: 'prompt' }, t.ru);
      const inp = el('input', { type: 'text', id: 'ans', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false', placeholder: t.kind === 'form' ? 'форма глагола' : 'по-испански…' });
      const res = el('div', { class: 'result', hidden: true });
      const btn = el('button', { class: 'primary', type: 'button' }, 'Проверить');
      let answered = false;
      const go = () => {
        if (!answered) {
          answered = true;
          const c = check(inp.value, t.es);
          const okish = c.res !== 'bad';
          let weakNote = null;
          if (!(t.idx in firstTry)) { // в серию и в счётчик ошибок идёт только первая попытка
            firstTry[t.idx] = okish;
            credit(t, okish);
            if (okish) { const h = weakHit(t); if (h === 'gone') weakNote = 'Исправлено: 4 верных ответа подряд, задание ушло из ошибок'; else if (h) weakNote = 'Работа над ошибкой: ' + dots(h); }
            else weakMiss(t, item.id);

          res.className = 'result ' + c.res;

            el('div', { class: 'es' }, first(t.es), speakBtn(first(t.es))));
          if (weakNote) res.append(el('small', { class: 'weaknote' }, weakNote));
          if (c.res === 'bad' && inp.value.trim()) res.append(el('div', { class: 'yours' }, 'Ваш ответ: ' + inp.value.trim()));
          const alts = t.es.split('|').slice(1).map(s => s.trim()); if (alts.length) res.append(el('small', { class: 'alts' }, 'Также верно: ' + alts.join(' · ')));
          if (!okish) {
            mistakes.push({ id: W ? t.from : item.id, q: t.kind === 'form' ? t.verb + ' · ' + personLabel(t.verb, t.person) + ' · ' + Conj.TENSES[t.tense] : t.ru, a: first(t.es), g: inp.value.trim(), at: Date.now() });
            // повтор через несколько заданий, как «эхо» у автора

          : passed ? 'Контрольная пройдена. Следующий урок открыт.' : 'Нужно 80% с первой попытки. Повторите теорию, послушайте её фоном и пройдите контрольную ещё раз: фразы будут в другом порядке.'),
        mistakes.length ? el('details', null, el('summary', null, 'Ошибки (' + mistakes.length + ')'), el('ul', { class: 'mist' }, mistakes.map(m => el('li', null, el('span', null, m.q), el('b', null, m.a), m.g ? el('s', null, m.g) : null)))) : null,
        W ? el('div', { class: 'row' },
          item.type === 'V' || weakList().length ? el('button', { class: 'primary', type: 'button', onclick: () => runTest(item) }, 'Ещё тренировка') : null,
          item.type === 'V' ? el('button', { class: 'ghost', type: 'button', onclick: renderVerbs }, 'Глаголы') : null,
          el('button', { class: 'ghost', type: 'button', onclick: renderErrors }, 'Мои ошибки'),
          el('button', { class: 'ghost', type: 'button', onclick: renderHome }, 'Карта курса')) :
        el('div', { class: 'row' },
          el('button', { class: 'ghost', type: 'button', onclick: () => runTest(item) }, 'Пройти ещё раз'),
          passed && BY_ID[item.id + 1] ? el('button', { class: 'primary', type: 'button', onclick: () => openLesson(item.id + 1) }, 'Следующий урок →') : null,

  function accentBar(inp) {

    const list = el('div', { class: 'wordlist' });

  }
  function verbStats() {
    const L = reachLesson(); let open = 0, done = 0, total = 0;
    for (const v in VINTRO) cellsOf(v).forEach(c => { total++; if (c.unlock <= L) { open++; if (cellGet(c.v, c.tn, c.p) >= CELL_NEED) done++; } });
    return { open, done, total, L };
  }
  function renderVerbs() {
    view = 'verbs'; window.scrollTo(0, 0);

        el('div', { class: 'tcard' }, el('span', null, 'Глаголов'), el('b', null, Object.keys(VINTRO).length)),
        el('div', { class: 'tcard' }, el('span', null, 'Всего форм в курсе'), el('b', null, st.total))),
      el('div', { class: 'row' }, el('button', { class: 'primary', type: 'button', disabled: !st.open, onclick: () => runTest({ id: 'verbs', type: 'V' }) }, 'Тренировать слабые формы')),
      el('div', { class: 'vlegend' }, el('span', null, el('i', { class: 'c0' }), 'не тренировалась'), el('span', null, el('i', { class: 'c1' }), '1–2 верных'), el('span', null, el('i', { class: 'c3' }), 'освоена'), el('span', null, el('i', { class: 'cl' }), 'ещё не пройдена')));
    const q = el('input', { type: 'search', placeholder: 'Найти глагол' });

    const head = el('div', { class: 'vrow vhead' }, el('span', null, ''), CT.map(tn => el('span', { class: 'vt' }, Conj.TENSES[tn].replace('pretérito ', ''))));

        const row = el('button', { class: 'vrow', type: 'button', 'aria-expanded': 'false' },
          el('span', { class: 'vn' }, el('b', null, v), el('small', null, glossOf(v))),
          CT.map(tn => el('span', { class: 'vt' }, [0, 1, 2, 3, 4].map(p => {
            const c = byK[tn + '|' + p];
            if (!c) return el('i', { class: 'cx', title: 'не используется' });
            const n = cellGet(v, tn, p), cls = c.unlock > st.L ? 'cl' : n >= CELL_NEED ? 'c3' : n > 0 ? 'c1' : 'c0';
            return el('i', { class: cls, title: personLabel(v, p) + ' · ' + Conj.TENSES[tn] + ': ' + c.form + (c.unlock > st.L ? ' (с урока ' + c.unlock + ')' : ' — верных: ' + n) });

            RESTRICT[v] || SPECIAL_FORMS[v]

                  el('b', null, cs.filter(c => c.tn === tn).map(c => c.form + (v === 'gustar' ? ' (' + (c.p === 4 ? 'мн.' : 'ед.') + ')' : '')).join(' · ')))))
